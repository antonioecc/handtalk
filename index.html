<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7000FF" />
  <meta name="description" content="Mano Mágica - PWA de comunicación asistida por dedos" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>🤚 Mano Mágica</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & ESTILOS BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --thumb-color:   #FF007F;
      --thumb-dark:    #C9005F;
      --index-color:   #FFD166;
      --index-dark:    #FFB703;
      --middle-color:  #4CC9F0;
      --middle-dark:   #00B4D8;
      --ring-color:    #06D6A0;
      --ring-dark:     #059669;
      --pinky-color:   #FF7D00;
      --pinky-dark:    #E05300;
      --palm-color:    #A78BFA;
      --palm-dark:     #7C3AED;

      --bg-gradient: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f0c29 50%, #050510 100%);
      --glass-panel: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-full: 9999px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 15% 25%, rgba(76, 201, 240, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(255, 0, 127, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 50% 10%, rgba(112, 0, 255, 0.15) 0%, transparent 50%);
      z-index: -1;
      pointer-events: none;
    }

    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #FFD166, #FF007F, #4CC9F0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.8px;
    }

    #sentence-bar {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border-radius: var(--radius-lg);
      padding: 12px 20px;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      backdrop-filter: blur(20px);
    }

    .sentence-placeholder {
      color: var(--text-muted);
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      width: 100%;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }

    .sentence-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      animation: popIn 0.3s forwards;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.25);
    }

    .sentence-chip .chip-emoji {
      font-size: 1.4rem;
    }

    @keyframes popIn {
      from { transform: scale(0.7) translateY(12px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    .main-area {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 16px;
      overflow: hidden;
      min-height: 0;
    }

    #hand-panel {
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 45px rgba(0,0,0,0.35);
      min-height: 0;
      gap: 12px;
    }

    .hand-layout-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100%;
      min-height: 0;
      width: 100%;
    }

    #hand-svg-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      height: 100%;
      min-height: 0;
    }

    #hand-svg {
      width: 100%;
      height: 100%;
      max-height: 320px;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
    }

    .hand-quick-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .btn-quick-action {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid var(--glass-border);
      color: #ffffff;
      font-size: 2.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-quick-action:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }
    
    .btn-quick-action:active {
      transform: scale(0.95);
    }

    #btn-speak-quick {
      background: linear-gradient(135deg, #4CC9F0, #7000FF);
      border-color: rgba(76, 201, 240, 0.4);
    }
    #btn-speak-quick:hover {
      box-shadow: 0 0 25px rgba(76, 201, 240, 0.5);
    }

    #btn-restart-quick {
      background: linear-gradient(135deg, #FF7D00, #FF007F);
      border-color: rgba(255, 0, 127, 0.4);
    }
    #btn-restart-quick:hover {
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
    }

    .finger-zone {
      cursor: pointer;
    }

    .hand-outline {
      fill: #fcd5ce;
      stroke: #12102e;
      stroke-width: 5.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: all 0.3s ease;
    }

    .hand-shadow {
      fill: #e8a598;
      pointer-events: none;
    }

    .finger-overlay {
      fill: transparent;
      stroke: transparent;
      stroke-width: 18;
      transition: all 0.3s ease;
    }

    .finger-zone:hover .finger-overlay {
      fill: rgba(255, 255, 255, 0.22);
    }

    .finger-zone.selected .finger-overlay {
      fill: var(--glow-color);
      stroke: #ffffff;
      opacity: 0.85;
    }

    .finger-zone.has-word .finger-overlay {
      fill: var(--glow-color);
      stroke: #ffffff;
      opacity: 0.7;
    }

    .finger-label-bg {
      rx: 10px; ry: 10px;
      fill: rgba(18, 16, 46, 0.85);
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1.2;
    }

    .finger-zone.has-word .finger-label-bg,
    .finger-zone.selected .finger-label-bg {
      fill: var(--glow-color);
      stroke: #ffffff;
    }

    .finger-word-text {
      font-size: 10px;
      font-weight: 800;
      fill: #cbd5e1;
      text-anchor: middle;
      pointer-events: none;
      font-family: 'Outfit', sans-serif;
    }

    .finger-zone.has-word .finger-word-text,
    .finger-zone.selected .finger-word-text {
      fill: #ffffff;
    }

    /* ===== CONTENEDOR DE SLOTS EN FORMATO "U" (Abajo de la mano) ===== */
    #fingers-list-u {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 4px;
    }

    .finger-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 48px;
    }

    .finger-slot:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .finger-slot.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--active-color);
      box-shadow: 0 4px 15px var(--glow-color);
    }

    .finger-slot-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .finger-dot {
      width: 12px; height: 12px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }

    .finger-slot-text-content {
      min-width: 0;
      flex: 1;
    }

    .finger-slot-name {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .finger-slot-word {
      font-size: 0.95rem;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .finger-slot-word.empty {
      color: rgba(255,255,255,0.2);
      font-weight: 600;
    }

    .finger-clear-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
      width: 24px; height: 24px;
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
      opacity: 0;
      pointer-events: none;
    }
    
    .finger-slot.has-word .finger-clear-btn {
      opacity: 1;
      pointer-events: all;
    }
    .finger-clear-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
    }

    /* ===== PANEL DERECHO DE PALABRAS ===== */
    #word-panel {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 45px rgba(0,0,0,0.35);
      min-height: 0;
      gap: 12px;
    }

    #word-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #active-finger-badge {
      padding: 6px 18px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #quick-text-container {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 6px;
    }

    #quick-text-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      padding: 8px 12px;
      font-weight: 600;
    }
    #quick-text-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .btn-quick-send {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .btn-quick-send:hover {
      background: white;
      color: #0f0a24;
    }

    #word-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      overflow-y: auto;
      align-content: start;
      padding-right: 6px;
    }

    .word-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      text-align: center;
      color: white;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .word-emoji {
      font-size: 1.4rem;
    }

    .word-btn:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .word-btn.selected {
      border-color: rgba(255,255,255,0.85);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.2);
    }

    #no-selection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 24px;
      height: 100%;
    }

    #no-selection .magic-hand {
      font-size: 4.5rem;
      animation: magicWiggle 3s ease-in-out infinite;
    }

    #btn-add-word {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      background: transparent;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    #modal-overlay {
      position: fixed; inset: 0;
      background: rgba(10, 5, 25, 0.85);
      backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
      padding: 20px;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }

    #modal {
      background: linear-gradient(135deg, #221a47 0%, #0f0a24 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.7);
    }

    .modal-actions {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }

    .btn-modal {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius-md);
      border: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .btn-cancel { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-add { background: linear-gradient(135deg, #7000FF, #4CC9F0); color: white; }

    #sentence-bar.speaking {
      border-color: rgba(76, 201, 240, 0.7);
      box-shadow: 0 0 35px rgba(76, 201, 240, 0.3);
    }

    .confetti {
      position: fixed;
      width: 12px; height: 12px;
      pointer-events: none;
      z-index: 200;
      animation: confettiFall 1.2s forwards;
    }

    @keyframes confettiFall {
      from { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      to   { transform: translateY(180px) rotate(540deg) scale(0.5); opacity: 0; }
    }

    @keyframes glowPulse {
      0%   { box-shadow: 0 0 0 0px var(--color, rgba(255,255,255,0.4)); }
      100% { box-shadow: 0 0 0 24px rgba(255,255,255,0); }
    }
    .glow-pulse { animation: glowPulse 0.6s ease-out; }

    @media (max-width: 768px) {
      #app { padding: 10px; gap: 12px; }
      .logo { font-size: 1.7rem; }
      .main-area { grid-template-columns: 1fr; grid-template-rows: auto auto; gap: 12px; overflow-y: auto; }
      #hand-panel { padding: 16px; }
      .hand-layout-container { flex-direction: row; }
      .hand-quick-actions { flex-direction: row; width: 100%; justify-content: center; }
      .btn-quick-action { width: 64px; height: 64px; font-size: 1.8rem; }
      #fingers-list-u { grid-template-columns: repeat(2, 1fr); }
      #word-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <div class="logo">🤚 Mano Mágica</div>
    </div>
  </header>

  <!-- BARRA DE ORACIÓN -->
  <div id="sentence-bar" role="region" aria-label="Oración actual">
    <span class="sentence-placeholder" id="sentence-placeholder">¡Formemos una oración! Toca un dedo o la palma... 👆</span>
  </div>

  <!-- AREA PRINCIPAL -->
  <div class="main-area">

    <!-- PANEL IZQUIERDO: MANO + CONTROLES ABAJO -->
    <div id="hand-panel">
      
      <div class="hand-layout-container">
        <!-- Mano SVG principal -->
        <div id="hand-svg-container">
          <svg id="hand-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Silueta Unificada de la mano -->
            <path class="hand-outline" d="
              M 205,440 
              C 195,395 185,360 178,350
              C 140,320 85,325 82,310
              C 79,295 110,270 175,278
              C 178,250 175,210 162,175
              C 145,115 178,85 200,98
              C 218,110 198,190 230,238
              C 220,135 220,50 248,50
              C 275,50 268,135 282,238
              C 298,145 305,60 332,68
              C 355,75 330,165 352,246
              C 375,170 398,105 418,118
              C 433,128 400,195 385,278
              C 382,330 380,360 340,395
              C 290,425 230,425 210,440 Z" 
            />

            <!-- Sombras anatómicas -->
            <path class="hand-shadow" d="M 82,310 C 110,340 180,380 230,370 C 310,350 350,330 385,278 C 375,340 340,395 340,395 C 290,425 230,425 210,440 Z" opacity="0.15" />
            <path d="M 185,280 C 205,305 245,315 285,300" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.25" />
            <path d="M 230,305 C 255,320 295,315 325,295" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2" />

            <!-- ZONAS INTERACTIVAS -->
            <!-- PALMA (Afecto) -->
            <g class="finger-zone" id="fz-palm" data-finger="palm" role="button" style="--glow-color: var(--palm-color);">
              <path class="finger-overlay" d="M 183,275 C 190,260 210,250 240,248 C 287,246 287,246 287,246 C 353,256 353,256 353,256 C 387,286 385,360 340,400 C 290,430 230,430 192,390 Z" />
              <rect class="finger-label-bg" x="200" y="320" width="100" height="26" rx="13"/>
              <text class="finger-word-text" id="hw-palm" x="250" y="337">❤️ AFECTO</text>
            </g>

            <!-- 👍 PULGAR (Cómo) -->
            <g class="finger-zone" id="fz-thumb" data-finger="thumb" role="button" style="--glow-color: var(--thumb-color);">
              <path class="finger-overlay" d="M 195,370 C 145,340 75,325 80,300 C 85,280 145,268 185,282 Z" />
              <rect class="finger-label-bg" x="6" y="240" width="80" height="24" rx="12"/>
              <text class="finger-word-text" id="hw-thumb" x="46" y="256">👍 CÓMO</text>
            </g>

            <!-- 👆 ÍNDICE (Quién) -->
            <g class="finger-zone" id="fz-index" data-finger="index" role="button" style="--glow-color: var(--index-color);">
              <path class="finger-overlay" d="M 160,250 C 142,168 182,90 210,100 C 228,115 200,205 240,248 Z" />
              <rect class="finger-label-bg" x="125" y="65" width="80" height="24" rx="12"/>
              <text class="finger-word-text" id="hw-index" x="165" y="81">👆 QUIÉN</text>
            </g>

            <!-- 🖕 MEDIO (Verbo) -->
            <g class="finger-zone" id="fz-middle" data-finger="middle" role="button" style="--glow-color: var(--middle-color);">
              <path class="finger-overlay" d="M 238,246 C 220,140 220,52 250,52 C 278,52 270,140 286,246 Z" />
              <rect class="finger-label-bg" x="210" y="20" width="80" height="24" rx="12"/>
              <text class="finger-word-text" id="hw-middle" x="250" y="36">🖕 VERBO</text>
            </g>

            <!-- 💍 ANULAR (Objeto) -->
            <g class="finger-zone" id="fz-ring" data-finger="ring" role="button" style="--glow-color: var(--ring-color);">
              <path class="finger-overlay" d="M 285,246 C 300,150 312,65 340,70 C 362,75 332,160 353,256 Z" />
              <rect class="finger-label-bg" x="305" y="35" width="80" height="24" rx="12"/>
              <text class="finger-word-text" id="hw-ring" x="345" y="51">💍 OBJETO</text>
            </g>

            <!-- 🤙 MEÑIQUE (Cortesía) -->
            <g class="finger-zone" id="fz-pinky" data-finger="pinky" role="button" style="--glow-color: var(--pinky-color);">
              <path class="finger-overlay" d="M 350,256 C 378,175 404,102 425,115 C 440,128 400,200 387,286 Z" />
              <rect class="finger-label-bg" x="390" y="85" width="80" height="24" rx="12"/>
              <text class="finger-word-text" id="hw-pinky" x="430" y="101">🤙 CORTESÍA</text>
            </g>
          </svg>
        </div>

        <!-- Botones Rápidos de Hablar y Borrar a la derecha de la mano -->
        <div class="hand-quick-actions">
          <button class="btn-quick-action" id="btn-speak-quick" title="Hablar oración" aria-label="Hablar">👄</button>
          <button class="btn-quick-action" id="btn-restart-quick" title="Borrar oración" aria-label="Borrar">♻️</button>
        </div>
      </div>

      <!-- Slots inferiores en U -->
      <div id="fingers-list-u" role="list"></div>

    </div>

    <!-- PANEL DERECHO: SELECCIÓN DE PALABRAS -->
    <div id="word-panel">
      <div id="word-panel-header">
        <span class="panel-header-title">Palabras disponibles</span>
        <span id="active-finger-badge">—</span>
      </div>

      <!-- Input de Escritura Libre Rápido -->
      <div id="quick-text-container" style="display: none;">
        <input type="text" id="quick-text-input" placeholder="Escribir palabra libre..." maxlength="30" />
        <button class="btn-quick-send" id="btn-quick-send" title="Confirmar palabra">✍️</button>
      </div>

      <!-- Estado Vacío -->
      <div id="no-selection">
        <div class="magic-hand">✨🖐️</div>
        <p>Selecciona una sección de la mano en la pantalla para ver y elegir sus palabras.</p>
      </div>

      <!-- Cuadrícula interactiva -->
      <div id="word-grid" style="display:none;"></div>

      <!-- Botón Agregar -->
      <button id="btn-add-word" style="display:none;">
        <span>➕</span> Crear nueva palabra
      </button>
    </div>

  </div><!-- fin main-area -->

</div><!-- fin app -->

<!-- MODAL REGISTRO PALABRA NUEVA -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal">
    <h3 id="modal-title">➕ Nueva Palabra</h3>
    <p>Agrega una palabra personalizada a este dedo o palma.</p>

    <label for="modal-word-input">Palabra (EJ: ABRACITO)</label>
    <input type="text" id="modal-word-input" placeholder="Escribe aquí..." maxlength="20" autocomplete="off" />

    <label for="modal-emoji-input">Emoji representativo (EJ: 🤗)</label>
    <input type="text" id="modal-emoji-input" placeholder="Elige un emoji..." maxlength="5" />

    <label for="modal-finger-select">Sección correspondiente</label>
    <select id="modal-finger-select">
      <option value="thumb">👍 Pulgar - Cómo / Lugar</option>
      <option value="index">👆 Índice - Sujeto (Quién)</option>
      <option value="middle">🖕 Medio - Verbo (Qué quiero)</option>
      <option value="ring">💍 Anular - Objeto (Qué cosa)</option>
      <option value="pinky">🤙 Meñique - Cortesía</option>
      <option value="palm">❤️ Palma - Afecto</option>
    </select>

    <div class="modal-actions">
      <button class="btn-modal btn-cancel" id="modal-cancel">Cancelar</button>
      <button class="btn-modal btn-add" id="modal-confirm">Guardar</button>
    </div>
  </div>
</div>

<script>
// ===================================================
// BASE DE DATOS Y VOCABULARIO
// ===================================================
const FINGERS = [
  { id: 'index',  emoji: '👆', label: 'Quién',       color: 'var(--index-color)',  dark: 'var(--index-dark)' },
  { id: 'middle', emoji: '🖕', label: 'Verbo',       color: 'var(--middle-color)', dark: 'var(--middle-dark)' },
  { id: 'ring',   emoji: '💍', label: 'Objeto',      color: 'var(--ring-color)',   dark: 'var(--ring-dark)' },
  { id: 'thumb',  emoji: '👍', label: 'Cómo/Lugar',  color: 'var(--thumb-color)',  dark: 'var(--thumb-dark)' },
  { id: 'pinky',  emoji: '🤙', label: 'Cortesía',    color: 'var(--pinky-color)',  dark: 'var(--pinky-dark)' },
  { id: 'palm',   emoji: '❤️', label: 'Afecto',      color: 'var(--palm-color)',   dark: 'var(--palm-dark)' }
];

const INITIAL_WORDS = {
  index: [ // Quién
    { text: 'YO', emoji: '👦' },
    { text: 'PAPA', emoji: '👨' },
    { text: 'MAMA', emoji: '👩' },
    { text: 'ABUELA', emoji: '👵' },
    { text: 'ABUELO', emoji: '👴' },
    { text: 'HERMANO', emoji: '👦' },
    { text: 'AMIGA', emoji: '👧' },
    { text: 'PROFE', emoji: '👩‍🏫' }
  ],
  middle: [ // Verbo
    { text: 'QUIERO', emoji: '🙋‍♂️' },
    { text: 'NECESITO', emoji: '⚠️' },
    { text: 'TENGO', emoji: '⚡' },
    { text: 'QUIERO IR', emoji: '🚗' }
  ],
  ring: [ // Objeto
    { text: 'AGUA', emoji: '💧' },
    { text: 'COMIDA', emoji: '🍎' },
    { text: 'TABLET', emoji: '📱' },
    { text: 'BAÑO', emoji: '🚽' },
    { text: 'PARQUE', emoji: '🛝' },
    { text: 'CAMINAR', emoji: '🚶' },
    { text: 'CARRO', emoji: '🚗' },
    { text: 'JUGAR', emoji: '🧩' },
    { text: 'DORMIR', emoji: '😴' },
    { text: 'TELEVISIÓN', emoji: '📺' }
  ],
  thumb: [ // Cómo / Lugar
    { text: 'AQUÍ', emoji: '📍' },
    { text: 'AFUERA', emoji: '🌳' },
    { text: 'AHORA', emoji: '⏰' },
    { text: 'EN CASA', emoji: '🏠' }
  ],
  pinky: [ // Cortesía
    { text: 'POR FAVOR', emoji: '🙏' },
    { text: 'GRACIAS', emoji: '💖' },
    { text: 'AYUDA', emoji: '🆘' }
  ],
  palm: [ // Afecto (Actualizado: con molesto y triste)
    { text: 'TE QUIERO', emoji: '❤️' },
    { text: 'ABRAZO', emoji: '🤗' },
    { text: 'BESO', emoji: '😘' },
    { text: 'FELIZ', emoji: '😊' },
    { text: 'MOLESTO', emoji: '😠' },
    { text: 'TRISTE', emoji: '😢' }
  ]
};

// ===================================================
// AUDIO EFECTOS (SINTETIZADOS)
// ===================================================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(type) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'click') {
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'success') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'reset') {
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }
  } catch(e) {}
}

// ===================================================
// ESTADO
// ===================================================
// Incrementamos a mm_words_v7 para aplicar la nueva actualización
let wordLibrary = JSON.parse(localStorage.getItem('mm_words_v7') || 'null') || INITIAL_WORDS;
let selectedWords = { thumb: null, index: null, middle: null, ring: null, pinky: null, palm: null };
let activeFinger = null;
let sentenceSequence = []; 

function saveLibrary() {
  localStorage.setItem('mm_words_v7', JSON.stringify(wordLibrary));
}

// ===================================================
// RENDERIZAR VISTAS
// ===================================================
function renderFingerSlots() {
  const list = document.getElementById('fingers-list-u');
  list.innerHTML = '';
  FINGERS.forEach(f => {
    const slot = document.createElement('div');
    slot.className = 'finger-slot' + (selectedWords[f.id] ? ' has-word' : '') + (activeFinger === f.id ? ' active' : '');
    slot.style.setProperty('--active-color', f.color);
    slot.style.setProperty('--glow-color', f.color.replace(')', ', 0.15)'));
    
    slot.innerHTML = `
      <div class="finger-slot-left">
        <div class="finger-dot" style="background-color:${f.color}"></div>
        <div class="finger-slot-text-content">
          <div class="finger-slot-name">${f.emoji} ${f.label}</div>
          <div class="finger-slot-word ${selectedWords[f.id] ? '' : 'empty'}">
            ${selectedWords[f.id] ? selectedWords[f.id].emoji + ' ' + selectedWords[f.id].text : 'Vacío'}
          </div>
        </div>
      </div>
      <button class="finger-clear-btn" title="Quitar">✕</button>
    `;

    slot.addEventListener('click', (e) => {
      if (e.target.closest('.finger-clear-btn')) return;
      playBeep('click');
      setActiveFinger(f.id);
    });

    slot.querySelector('.finger-clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      playBeep('reset');
      clearFinger(f.id);
    });

    list.appendChild(slot);
  });
}

function updateHandSVG() {
  FINGERS.forEach(f => {
    const zone = document.getElementById(`fz-${f.id}`);
    const txt = document.getElementById(`hw-${f.id}`);
    
    if (selectedWords[f.id]) {
      zone.classList.add('has-word');
      const wText = selectedWords[f.id].text;
      txt.textContent = selectedWords[f.id].emoji + ' ' + (wText.length > 7 ? wText.substring(0,6) + '…' : wText);
    } else {
      zone.classList.remove('has-word');
      const defaultLabels = { thumb: '👍 CÓMO', index: '👆 QUIÉN', middle: '🖕 VERBO', ring: '💍 OBJETO', pinky: '🤙 CORTESÍA', palm: '❤️ AFECTO' };
      txt.textContent = defaultLabels[f.id];
    }
    
    zone.classList.toggle('selected', activeFinger === f.id);
  });
}

function updateSentenceBar() {
  const bar = document.getElementById('sentence-bar');
  const placeholder = document.getElementById('sentence-placeholder');
  
  const chips = bar.querySelectorAll('.sentence-chip');
  chips.forEach(c => c.remove());

  if (sentenceSequence.length === 0) {
    placeholder.style.display = 'block';
  } else {
    placeholder.style.display = 'none';
    
    sentenceSequence.forEach(item => {
      const chip = document.createElement('span');
      chip.className = 'sentence-chip';
      
      const finger = FINGERS.find(f => f.id === item.fingerId);
      chip.style.backgroundColor = finger ? finger.dark : '#7000FF';
      
      chip.innerHTML = `
        <span class="chip-emoji">${item.emoji}</span>
        <span>${item.text}</span>
      `;
      bar.appendChild(chip);
    });
  }
}

function renderWordPicker() {
  const noSel = document.getElementById('no-selection');
  const grid = document.getElementById('word-grid');
  const badge = document.getElementById('active-finger-badge');
  const addBtn = document.getElementById('btn-add-word');
  const quickInputContainer = document.getElementById('quick-text-container');
  const quickInput = document.getElementById('quick-text-input');

  if (!activeFinger) {
    noSel.style.display = 'flex';
    grid.style.display = 'none';
    addBtn.style.display = 'none';
    badge.style.display = 'none';
    quickInputContainer.style.display = 'none';
    return;
  }

  const f = FINGERS.find(f => f.id === activeFinger);
  noSel.style.display = 'none';
  grid.style.display = 'grid';
  addBtn.style.display = 'flex';
  badge.style.display = 'inline-block';
  quickInputContainer.style.display = 'flex';
  
  quickInput.value = '';
  quickInput.placeholder = `Escribir en ${f.label}...`;

  badge.textContent = `${f.emoji} ${f.label}`;
  badge.style.backgroundColor = f.dark;

  grid.innerHTML = '';
  const list = wordLibrary[activeFinger] || [];
  
  list.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'word-btn';
    btn.style.backgroundColor = 'rgba(255,255,255,0.03)';
    btn.style.borderLeft = `5px solid ${f.dark}`;
    
    if (selectedWords[activeFinger] && selectedWords[activeFinger].text === item.text) {
      btn.classList.add('selected');
      btn.style.backgroundColor = 'rgba(255,255,255,0.08)';
    }

    btn.innerHTML = `
      <span class="word-emoji">${item.emoji}</span>
      <span>${item.text}</span>
    `;

    btn.addEventListener('click', () => {
      playBeep('success');
      selectWord(activeFinger, item);
      burstConfetti();
    });
    
    grid.appendChild(btn);
  });
}

function sendQuickText() {
  const quickInput = document.getElementById('quick-text-input');
  const textVal = quickInput.value.trim().toUpperCase();
  if (!textVal || !activeFinger) return;

  const f = FINGERS.find(f => f.id === activeFinger);
  const customItem = { text: textVal, emoji: f.emoji };

  playBeep('success');
  selectWord(activeFinger, customItem);
  burstConfetti();
  quickInput.value = '';
}

function setActiveFinger(fingerId) {
  activeFinger = activeFinger === fingerId ? null : fingerId;
  renderFingerSlots();
  updateHandSVG();
  renderWordPicker();
}

function selectWord(fingerId, item) {
  selectedWords[fingerId] = item;
  
  const index = sentenceSequence.findIndex(s => s.fingerId === fingerId);
  if (index !== -1) {
    sentenceSequence[index] = { fingerId, text: item.text, emoji: item.emoji };
  } else {
    sentenceSequence.push({ fingerId, text: item.text, emoji: item.emoji });
  }

  updateSentenceBar();
  updateHandSVG();
  renderFingerSlots();
  renderWordPicker();
  
  const zone = document.getElementById(`fz-${fingerId}`);
  if (zone) {
    zone.classList.add('glow-pulse');
    setTimeout(() => zone.classList.remove('glow-pulse'), 600);
  }
}

function clearFinger(fingerId) {
  selectedWords[fingerId] = null;
  sentenceSequence = sentenceSequence.filter(s => s.fingerId !== fingerId);
  
  updateSentenceBar();
  updateHandSVG();
  renderFingerSlots();
  if (activeFinger === fingerId) renderWordPicker();
}

function restart() {
  playBeep('reset');
  selectedWords = { thumb: null, index: null, middle: null, ring: null, pinky: null, palm: null };
  sentenceSequence = [];
  activeFinger = null;
  updateSentenceBar();
  updateHandSVG();
  renderFingerSlots();
  renderWordPicker();
}

function speakSentence() {
  if (sentenceSequence.length === 0) return;
  
  const phrase = sentenceSequence.map(s => s.text).join(' ');
  
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(phrase);
  utterance.lang = 'es-ES';
  utterance.rate = 0.8;
  
  const bar = document.getElementById('sentence-bar');
  bar.classList.add('speaking');
  
  utterance.onend = () => bar.classList.remove('speaking');
  utterance.onerror = () => bar.classList.remove('speaking');
  
  window.speechSynthesis.speak(utterance);
}

function burstConfetti() {
  const colors = ['#FFD166','#4CC9F0','#06D6A0','#FF007F','#FF7D00'];
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = (Math.random() * 80 + 10) + 'vw';
    el.style.top  = (Math.random() * 30 + 10) + 'vh';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = '50%';
    el.style.animationDuration = (Math.random() * 0.4 + 0.8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}

const overlay = document.getElementById('modal-overlay');
const inputWord = document.getElementById('modal-word-input');
const inputEmoji = document.getElementById('modal-emoji-input');
const selectFinger = document.getElementById('modal-finger-select');

document.getElementById('btn-add-word').addEventListener('click', () => {
  if (activeFinger) selectFinger.value = activeFinger;
  inputWord.value = '';
  inputEmoji.value = '✨';
  overlay.classList.add('open');
  inputWord.focus();
});

document.getElementById('modal-cancel').addEventListener('click', () => {
  overlay.classList.remove('open');
});

document.getElementById('modal-confirm').addEventListener('click', () => {
  const txt = inputWord.value.trim().toUpperCase();
  const emo = inputEmoji.value.trim() || '✨';
  const fng = selectFinger.value;

  if (!txt) {
    inputWord.focus();
    return;
  }

  if (!wordLibrary[fng]) wordLibrary[fng] = [];
  
  if (!wordLibrary[fng].some(w => w.text === txt)) {
    wordLibrary[fng].push({ text: txt, emoji: emo });
    saveLibrary();
  }

  overlay.classList.remove('open');
  if (activeFinger === fng) renderWordPicker();
  selectWord(fng, { text: txt, emoji: emo });
});

document.getElementById('btn-speak-quick').addEventListener('click', speakSentence);
document.getElementById('btn-restart-quick').addEventListener('click', restart);

document.getElementById('btn-quick-send').addEventListener('click', sendQuickText);
document.getElementById('quick-text-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    sendQuickText();
  }
});

FINGERS.forEach(f => {
  const zone = document.getElementById(`fz-${f.id}`);
  if (zone) {
    zone.addEventListener('click', () => {
      playBeep('click');
      setActiveFinger(f.id);
    });
  }
});

renderFingerSlots();
updateHandSVG();
updateSentenceBar();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
